# Public deployment on one small VPS. Layer it over the base and dense-tier files:
#   docker compose -f docker-compose.yml -f docker-compose.models.yml -f docker-compose.prod.yml up -d
# Caddy terminates HTTPS and is the only published service. Secrets come only from
# .env on the server. Step-by-step guide: docs/deployment.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    restart: unless-stopped
    # Not published: reachable only through Caddy -> nginx on the Compose network.
    ports: !reset []
    environment:
      # Only the light index is built on the server, so auto resolves to light and
      # falls back to minimal if the light tier cannot load.
      RETRIEVAL_TIER: ${RETRIEVAL_TIER:-auto}
      # Caddy and nginx both append to X-Forwarded-For.
      TRUSTED_PROXY_HOPS: "2"
    command:
      - uvicorn
      - researchlens.api:app
      - --host=0.0.0.0
      - --port=8000
      - --limit-concurrency=32
      - --timeout-keep-alive=5
      - --no-server-header
    logging: *logging

  frontend:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Absolute URLs in the link-preview tags (og:url, og:image, canonical).
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, for example demo.example.com}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, for example demo.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
