[project]
name = "researchlens"
version = "0.1.0"
description = "Evidence inspection for a small technical document corpus"
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
