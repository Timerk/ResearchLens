[project]
name = "researchlens"
version = "0.1.0"
description = "Evidence inspection for a small technical document corpus"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "scikit-learn>=1.6,<2", "numpy>=2,<3", "openai>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
embeddings = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=1,<2"]
embedding-models = ["torch>=2.7,<3", "transformers>=5,<6", "huggingface-hub>=1,<2", "safetensors>=0.5,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
