# Release deploy: pushing a tag such as v1.0.0 runs the full CI suite, then deploys that
# tag to the VPS over SSH with deploy/deploy.sh. Configure the "production" environment
# (secrets, optional required reviewer) first; see docs/deployment.md.
name: Deploy
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the tag on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/researchlens' }}
          REF: ${{ github.ref_name }}
        run: |
          [[ "$REF" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unexpected tag $REF"; exit 1; }
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy/deploy.sh '$REF'"
      - name: Public health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --silent --show-error --fail --retry 10 --retry-delay 5 --retry-all-errors \
            "$SITE_URL/api/health" | jq -e '.status == "ok" and .retrieval_tier == "light"'
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
