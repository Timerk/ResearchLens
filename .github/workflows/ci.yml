name: CI
on:
  # Branch pushes only; release tags run these jobs through deploy.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest -q --cov=researchlens --cov=researchlens_eval --cov-fail-under=75
      - run: uv run --directory backend python -m researchlens.ingest
      - run: uv run --directory backend python -m researchlens_eval.demo_recordings --check
  backend-extras:
    runs-on: ubuntu-latest
    env:
      # The pooling/tokenizer tests use mocks and an in-memory vocabulary.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.23"
      - run: uv sync --locked --extra embeddings --extra embedding-models --python 3.13
      - run: uv run python -c "import torch, transformers, tokenizers, onnxruntime"
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: |
          test "$(curl --silent --show-error --fail --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/health)" = 200
          test "$(curl --silent --show-error --fail --output response.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"question":"Why combine forward and backward lighting for aircraft glass canopy inspection?"}' \
            http://127.0.0.1:4200/api/ask)" = 200
          jq -e '.status == "passages_found"' response.json
      - name: Recorded examples and security headers through nginx
        run: |
          curl --silent --show-error --fail http://127.0.0.1:4200/api/demo \
            | jq -e '(.examples | length) >= 3 and .live_answers == "not_configured"'
          curl --silent --show-error --fail http://127.0.0.1:4200/api/examples/canopy-heater-fusion \
            | jq -e '.replay.label | startswith("Recorded answer from evaluation run")'
          curl --silent --show-error --fail --dump-header headers.txt --output /dev/null http://127.0.0.1:4200/
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          if grep -qi '^access-control-allow-origin' headers.txt; then exit 1; fi
      - name: DEMO_ONLY kill switch makes no paid call even with a key configured
        env:
          ANSWER_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          DEMO_ONLY: "true"
        run: |
          docker compose up -d --wait
          curl --silent --show-error --fail http://127.0.0.1:4200/api/health | jq -e '.mode == "local_preview"'
          curl --silent --show-error --fail --header 'Content-Type: application/json' \
            --data '{"question":"Why combine forward and backward lighting for aircraft glass canopy inspection?"}' \
            http://127.0.0.1:4200/api/ask \
            | jq -e '.status == "passages_found" and .fallback_reason == "demo_only"'
      - name: Production override and Caddyfile are valid
        env:
          SITE_ADDRESS: demo.example.com
        run: |
          docker compose -f docker-compose.yml -f docker-compose.models.yml -f docker-compose.prod.yml config --quiet
          docker run --rm -e SITE_ADDRESS \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
