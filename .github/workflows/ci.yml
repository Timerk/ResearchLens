name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.23"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest -q --cov=researchlens --cov=researchlens_eval --cov-fail-under=75
      - run: uv run --directory backend python -m researchlens.ingest
  backend-extras:
    runs-on: ubuntu-latest
    env:
      # The pooling/tokenizer tests use mocks and an in-memory vocabulary.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.23"
      - run: uv sync --locked --extra embeddings --extra embedding-models --python 3.13
      - run: uv run python -c "import torch, transformers, tokenizers, onnxruntime"
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: |
          test "$(curl --silent --show-error --fail --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/health)" = 200
          test "$(curl --silent --show-error --fail --output response.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"question":"Why combine forward and backward lighting for aircraft glass canopy inspection?"}' \
            http://127.0.0.1:4200/api/ask)" = 200
          jq -e '.status == "passages_found"' response.json
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
