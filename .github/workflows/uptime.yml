# Uptime check for the public demo. A failed run triggers GitHub's normal failure email
# to the repository owner. Set the repository variable SITE_URL (and EXPECTED_TIER if
# the server does not run the light tier); without SITE_URL the check is skipped.
# GitHub may delay scheduled runs and pauses them after 60 days without repository
# activity.
name: Uptime
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health, tier and a recorded example
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_TIER: ${{ vars.EXPECTED_TIER || 'light' }}
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 "$SITE_URL/api/health" \
            | jq -e --arg tier "$EXPECTED_TIER" '.status == "ok" and .retrieval_tier == $tier'
          curl --silent --show-error --fail --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 "$SITE_URL/api/examples/canopy-heater-fusion" \
            | jq -e '.replay.label | startswith("Recorded answer")'
