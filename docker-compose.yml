# One-command start: docker compose up --build, then open http://127.0.0.1:4200.
# Defaults to the minimal tier (TF-IDF), which downloads no models.
# For the dense tiers, add docker-compose.models.yml; see docs/docker.md.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UV_EXTRAS: ${UV_EXTRAS:-}
    environment:
      RETRIEVAL_TIER: ${RETRIEVAL_TIER-minimal}
      # Only the answer settings are read from .env. Retrieval overrides such as
      # RETRIEVAL_BACKEND are not passed, so they cannot disable tier selection.
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      # Public-demo controls; see .env.example and docs/deployment.md.
      DEMO_ONLY: ${DEMO_ONLY:-false}
      LIVE_ANSWERS_PER_VISITOR_PER_DAY: ${LIVE_ANSWERS_PER_VISITOR_PER_DAY:-5}
      LIVE_ANSWERS_PER_DAY: ${LIVE_ANSWERS_PER_DAY:-50}
      ALLOW_VISITOR_API_KEYS: ${ALLOW_VISITOR_API_KEYS:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # nginx is the only proxy in front of the backend here.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LIVE_QUOTA_DB: /var/lib/researchlens/live-quota.sqlite3
    volumes:
      # Live-answer counts survive restarts and rebuilds.
      - live-quota:/var/lib/researchlens
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"

volumes:
  live-quota:
