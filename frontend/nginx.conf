server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # Questions are at most 2,000 characters; reject oversized bodies early.
    client_max_body_size 16k;

    # Same origin only: no CORS headers are sent, so browsers block cross-origin API reads.
    # Turnstile (optional bot check) is the only third-party script and frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # The backend counts live answers per client; see TRUSTED_PROXY_HOPS.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        # OpenAI answers can take up to the provider's 45-second timeout.
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
